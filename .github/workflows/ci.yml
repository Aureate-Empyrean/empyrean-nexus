name: Nexus CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check backend examples tests scripts deploy
      - run: ruff format --check backend examples tests scripts deploy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - run: docker compose --profile example build
      - name: Real Docker contract test
        run: python scripts/docker_smoke.py
