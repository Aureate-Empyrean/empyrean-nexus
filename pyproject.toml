[project]
name = "empyrean-nexus"
version = "0.1.3"
description = "Open software. Private by design."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "argon2-cffi>=23,<26", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "packaging>=24,<27", "docker>=7.1,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
